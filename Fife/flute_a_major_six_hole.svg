<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100mm" height="430mm" viewBox="0 0 100 430"
     xmlns="http://www.w3.org/2000/svg" version="1.1">
  <title>Six-Hole A Major Flute Design (Fife-Style Embouchure)</title>
  <desc>Flute design showing hole placements based on acoustic and ergonomic considerations, with fife-style embouchure position</desc>
  
  <!-- Background for better visibility -->
  <rect x="0" y="0" width="100" height="430" fill="#f8f8f8"/>
  
  <!-- Flute tube outline -->
  <rect x="39.0" y="0" width="22" height="390" 
        fill="white" stroke="black" stroke-width="0.5"/>
  
  <!-- Cut point indicators -->
  <line x1="34.0" y1="0" x2="66.0" y2="0" 
        stroke="red" stroke-width="1"/>
  <text x="-1.0" y="5" font-family="sans-serif" font-size="8">Top Cut</text>
  
  <line x1="34.0" y1="390" x2="66.0" y2="390" 
        stroke="red" stroke-width="1"/>
  <text x="-1.0" y="400" font-family="sans-serif" font-size="8">Bottom Cut</text>
  
  <!-- Embouchure hole (oval shape) -->
  <circle cx="50.0" cy="41.0" r="5.0" 
         fill="none" stroke="red" stroke-width="1"/>
  <circle cx="50.0" cy="49.0" r="5.0" 
         fill="none" stroke="red" stroke-width="1"/>
  <rect x="45.0" y="41.0" width="10" height="8" 
        fill="none" stroke="red" stroke-width="1"/>
  <text x="69.0" y="49" font-family="sans-serif" font-size="8">Embouchure</text>
  <!-- B4 Hole (Hole 6) -->
  <circle cx="50.0" cy="350" r="4.5" 
         fill="none" stroke="blue" stroke-width="1.5"/>
  <text x="69.0" y="354" font-family="sans-serif" font-size="8">B4 (R3)</text>
  <!-- C#5 Hole (Hole 5) -->
  <circle cx="50.0" cy="323" r="4.5" 
         fill="none" stroke="blue" stroke-width="1.5"/>
  <text x="69.0" y="327" font-family="sans-serif" font-size="8">C#5 (R2)</text>
  <!-- D5 Hole (Hole 4) -->
  <circle cx="50.0" cy="298" r="4.5" 
         fill="none" stroke="blue" stroke-width="1.5"/>
  <text x="69.0" y="302" font-family="sans-serif" font-size="8">D5 (R1)</text>
  <!-- E5 Hole (Hole 3) -->
  <circle cx="50.0" cy="268" r="4.5" 
         fill="none" stroke="blue" stroke-width="1.5"/>
  <text x="69.0" y="272" font-family="sans-serif" font-size="8">E5 (L3)</text>
  <!-- F#5 Hole (Hole 2) -->
  <circle cx="50.0" cy="240" r="4.5" 
         fill="none" stroke="blue" stroke-width="1.5"/>
  <text x="69.0" y="244" font-family="sans-serif" font-size="8">F#5 (L2)</text>
  <!-- G#5 Hole (Hole 1) -->
  <circle cx="50.0" cy="215" r="4.5" 
         fill="none" stroke="blue" stroke-width="1.5"/>
  <text x="69.0" y="219" font-family="sans-serif" font-size="8">G#5 (L1)</text>
</svg>
