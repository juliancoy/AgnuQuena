name: Actions permission probe

on:
  push:
    branches:
      - agent/angle-joint-radius-transition
    paths:
      - .github/workflows/actions-probe.yml

permissions:
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish probe status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state=success \
            -f context=actions-probe \
            -f description='GitHub Actions is running on the fix branch'
